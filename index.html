<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <title>智子 4.0 | Gemini Live</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07080c;
        --ink: #f4f6fb;
        --muted: rgba(244, 246, 251, 0.58);
        --line: rgba(255, 255, 255, 0.1);
        --glass: rgba(16, 18, 26, 0.62);
        --accent: #7c6cff;
        --mint: #5ee0c0;
        --danger: #ff5d73;
        --level: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
      }

      .app {
        position: relative;
        height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      }

      .app::before {
        content: "";
        position: fixed;
        inset: -20%;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 12%, rgba(124, 108, 255, 0.28), transparent 32%),
          radial-gradient(circle at 88% 82%, rgba(94, 224, 192, 0.16), transparent 28%);
      }

      .topbar,
      .dock {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
      }

      .topbar {
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .mark {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(145deg, #9ae7ff, #7c6cff 58%, #ff8ad4);
        box-shadow: 0 10px 28px rgba(124, 108, 255, 0.32);
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-copy strong {
        display: block;
        font-size: 14px;
        letter-spacing: 0.04em;
      }

      .brand-copy span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        backdrop-filter: blur(18px);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6d7488;
        box-shadow: 0 0 0 4px rgba(109, 116, 136, 0.16);
      }

      .app.connecting .dot {
        background: #f0c14a;
        box-shadow: 0 0 0 4px rgba(240, 193, 74, 0.16);
      }

      .app.live .dot {
        background: var(--mint);
        box-shadow: 0 0 0 4px rgba(94, 224, 192, 0.16);
      }

      .stage {
        position: relative;
        z-index: 1;
        min-height: 0;
        margin: 16px 0;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #101218;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .preview,
      .placeholder {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .preview {
        object-fit: cover;
        background: #000;
        transform: scaleX(-1);
      }

      .preview.rear {
        transform: none;
      }

      .placeholder {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(124, 108, 255, 0.22), transparent 42%),
          linear-gradient(180deg, #151822, #0c0e14);
      }

      .placeholder.hidden {
        display: none;
      }

      .cam-off-icon {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
      }

      .ai-card {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 118px;
        padding: 10px 10px 12px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: rgba(10, 12, 18, 0.72);
        backdrop-filter: blur(18px);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      .orb {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 18px;
        overflow: hidden;
        background: #0b0d14;
      }

      .orb::before {
        content: "";
        position: absolute;
        inset: 18%;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff, #9ae7ff 18%, #7c6cff 48%, #26183f 78%);
        transform: scale(calc(0.92 + var(--level) * 0.22));
        filter: blur(0.2px);
        box-shadow: 0 0 calc(18px + var(--level) * 28px) rgba(124, 108, 255, 0.45);
      }

      .ai-card small {
        display: block;
        margin-top: 8px;
        text-align: center;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .captions {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 14px;
        display: grid;
        gap: 8px;
        pointer-events: none;
      }

      .caption {
        max-width: 82%;
        padding: 10px 12px;
        border-radius: 16px;
        background: rgba(8, 10, 16, 0.7);
        backdrop-filter: blur(16px);
        font-size: 13px;
        line-height: 1.45;
        opacity: 0;
        transform: translateY(6px);
        transition: 0.25s ease;
      }

      .caption.show {
        opacity: 1;
        transform: none;
      }

      .caption.ai {
        justify-self: start;
        border: 1px solid rgba(124, 108, 255, 0.22);
      }

      .caption.user {
        justify-self: end;
        border: 1px solid rgba(94, 224, 192, 0.18);
      }

      .dock {
        justify-content: center;
        gap: 14px;
      }

      .ctrl {
        width: 58px;
        height: 58px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--glass);
        color: var(--ink);
        backdrop-filter: blur(18px);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          border-color 0.2s ease;
      }

      .ctrl:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.08);
      }

      .ctrl:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      .ctrl.off {
        background: rgba(255, 93, 115, 0.16);
        border-color: rgba(255, 93, 115, 0.28);
        color: #ffb3be;
      }

      .ctrl.call {
        width: 74px;
        height: 74px;
        background: linear-gradient(180deg, #8d80ff, #6354ea);
        border: 0;
        box-shadow: 0 16px 36px rgba(99, 84, 234, 0.38);
      }

      .ctrl.call.end {
        background: linear-gradient(180deg, #ff7b8c, #e4455c);
        box-shadow: 0 16px 36px rgba(228, 69, 92, 0.32);
      }

      .status {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 2;
        max-width: calc(100% - 150px);
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(10, 12, 18, 0.66);
        backdrop-filter: blur(16px);
        color: var(--muted);
        font-size: 12px;
      }

      svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .ctrl.call svg {
        width: 26px;
        height: 26px;
      }
    </style>
  </head>
  <body>
    <main class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="#fff">
              <path d="M12 4v4M8 8h8M7 12c1.6 2.4 3.2 3.5 5 3.5S15.4 14.4 17 12" />
              <circle cx="12" cy="12" r="8.2" />
            </svg>
          </div>
          <div class="brand-copy">
            <strong>Gemini Live</strong>
            <span>3.8 · 视频通话</span>
          </div>
        </div>
        <div class="pill"><span class="dot"></span><span id="badge">离线</span></div>
      </header>

      <section class="stage" aria-label="视频画面">
        <video id="preview" class="preview" autoplay muted playsinline></video>
        <div id="placeholder" class="placeholder">
          <div class="cam-off-icon">
            <svg viewBox="0 0 24 24">
              <path d="M3 7.5h10.5A1.5 1.5 0 0 1 15 9v8.5A1.5 1.5 0 0 1 13.5 19H3.5A1.5 1.5 0 0 1 2 17.5V9A1.5 1.5 0 0 1 3.5 7.5H3" />
              <path d="m15 11 6-3v10l-6-3" />
              <path d="m3 4 18 16" />
            </svg>
          </div>
        </div>
        <div class="status" id="status">点下方按钮开始视频通话</div>
        <aside class="ai-card">
          <div class="orb" aria-hidden="true"></div>
          <small id="aiState">Gemini</small>
        </aside>
        <div class="captions">
          <div class="caption ai" id="aiCaption"></div>
          <div class="caption user" id="userCaption"></div>
        </div>
      </section>

      <nav class="dock">
        <button class="ctrl" id="flipBtn" type="button" aria-label="切换摄像头" title="切换前后摄像头">
          <svg viewBox="0 0 24 24">
            <path d="M7 8h10l-2-2" />
            <path d="M17 16H7l2 2" />
            <circle cx="12" cy="12" r="8.5" />
          </svg>
        </button>
        <button class="ctrl call" id="callBtn" type="button" aria-label="开始通话">
          <svg viewBox="0 0 24 24" id="callIcon">
            <path d="M6.5 9.5c3 6 8 8 8 8l2.6-2.6a1 1 0 0 1 1-.24l3.3.88a1 1 0 0 1 .74 1v3.16a1 1 0 0 1-1.1 1A17.5 17.5 0 0 1 4.3 5.96a1 1 0 0 1 1-1.1h3.16a1 1 0 0 1 1 .74l.88 3.3a1 1 0 0 1-.24 1z" />
          </svg>
        </button>
        <button class="ctrl" id="camBtn" type="button" aria-label="关闭摄像头" title="开关摄像头">
          <svg viewBox="0 0 24 24">
            <path d="M3.5 8h11A1.5 1.5 0 0 1 16 9.5v7A1.5 1.5 0 0 1 14.5 18h-11A1.5 1.5 0 0 1 2 16.5v-7A1.5 1.5 0 0 1 3.5 8z" />
            <path d="m16 11 5.2-2.4v8.8L16 15" />
          </svg>
        </button>
      </nav>
    </main>

    <script>
      "use strict";

      const MODEL = "gemini-3.8-live";
      const LIVE_WS_URL = "wss://live.jasonbai.dpdns.org/live";
      const FRAME_MS = 1000;
      const FRAME_MAX = 768;
      const JPEG_QUALITY = 0.72;

      const appEl = document.getElementById("app");
      const previewEl = document.getElementById("preview");
      const placeholderEl = document.getElementById("placeholder");
      const statusEl = document.getElementById("status");
      const badgeEl = document.getElementById("badge");
      const aiStateEl = document.getElementById("aiState");
      const aiCaptionEl = document.getElementById("aiCaption");
      const userCaptionEl = document.getElementById("userCaption");
      const callBtn = document.getElementById("callBtn");
      const flipBtn = document.getElementById("flipBtn");
      const camBtn = document.getElementById("camBtn");

      let ws = null;
      let connected = false;
      let connecting = false;
      let setupComplete = false;
      let talking = false;
      let manualClosing = false;
      let cameraOn = true;
      let facingMode = "user";
      let flipping = false;

      let audioStream = null;
      let videoStream = null;
      let inputContext = null;
      let outputContext = null;
      let sourceNode = null;
      let processorNode = null;
      let silentGain = null;
      let outputAnalyser = null;
      let outputAnalyserBytes = null;
      let orbRaf = 0;
      const activeAudioSources = new Set();
      let nextPlayTime = 0;
      let speakingTimer = null;
      let frameTimer = 0;
      let captureCanvas = null;
      let captureCtx = null;
      let sendingFrame = false;
      let userTranscript = "";
      let aiTranscript = "";
      let screenWakeLock = null;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function setAppState(state) {
        appEl.classList.remove("connecting", "live");
        if (state) appEl.classList.add(state);
      }

      function setCaption(el, text) {
        el.textContent = text;
        el.classList.toggle("show", Boolean(text));
      }

      function updateCameraUI() {
        placeholderEl.classList.toggle("hidden", cameraOn && Boolean(videoStream));
        previewEl.classList.toggle("rear", facingMode === "environment");
        camBtn.classList.toggle("off", !cameraOn);
        camBtn.title = cameraOn ? "关闭摄像头" : "开启摄像头";
      }

      function setCallButton(inCall) {
        callBtn.classList.toggle("end", inCall);
        callBtn.setAttribute("aria-label", inCall ? "结束通话" : "开始通话");
        callBtn.innerHTML = inCall
          ? '<svg viewBox="0 0 24 24"><path d="M6.5 9.5c3 6 8 8 8 8l2.6-2.6a1 1 0 0 1 1-.24l3.3.88a1 1 0 0 1 .74 1v3.16a1 1 0 0 1-1.1 1A17.5 17.5 0 0 1 4.3 5.96a1 1 0 0 1 1-1.1h3.16a1 1 0 0 1 1 .74l.88 3.3a1 1 0 0 1-.24 1z"/><path d="M4 4l16 16"/></svg>'
          : '<svg viewBox="0 0 24 24"><path d="M6.5 9.5c3 6 8 8 8 8l2.6-2.6a1 1 0 0 1 1-.24l3.3.88a1 1 0 0 1 .74 1v3.16a1 1 0 0 1-1.1 1A17.5 17.5 0 0 1 4.3 5.96a1 1 0 0 1 1-1.1h3.16a1 1 0 0 1 1 .74l.88 3.3a1 1 0 0 1-.24 1z"/></svg>';
      }

      async function requestWakeLock() {
        try {
          if (navigator.wakeLock) screenWakeLock = await navigator.wakeLock.request("screen");
        } catch (_) {}
      }

      async function releaseWakeLock() {
        try {
          await screenWakeLock?.release();
        } catch (_) {}
        screenWakeLock = null;
      }

      function arrayBufferToBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        for (let i = 0; i < bytes.length; i += 0x8000) {
          binary += String.fromCharCode(...bytes.subarray(i, Math.min(i + 0x8000, bytes.length)));
        }
        return btoa(binary);
      }

      function base64ToArrayBuffer(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
      }

      async function websocketDataToText(data) {
        if (typeof data === "string") return data;
        if (data instanceof Blob) return await data.text();
        if (data instanceof ArrayBuffer) return new TextDecoder("utf-8").decode(data);
        if (ArrayBuffer.isView(data)) return new TextDecoder("utf-8").decode(data.buffer);
        return null;
      }

      function floatTo16BitPCM(float32Array) {
        const buffer = new ArrayBuffer(float32Array.length * 2);
        const view = new DataView(buffer);
        for (let i = 0; i < float32Array.length; i++) {
          const sample = Math.max(-1, Math.min(1, float32Array[i]));
          view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        }
        return buffer;
      }

      function downsampleTo16k(buffer, inputSampleRate) {
        if (inputSampleRate === 16000) return buffer;
        const ratio = inputSampleRate / 16000;
        const newLength = Math.round(buffer.length / ratio);
        const result = new Float32Array(newLength);
        let offsetBuffer = 0;
        for (let i = 0; i < newLength; i++) {
          const nextOffsetBuffer = Math.round((i + 1) * ratio);
          let accum = 0;
          let count = 0;
          for (let j = offsetBuffer; j < nextOffsetBuffer && j < buffer.length; j++) {
            accum += buffer[j];
            count++;
          }
          result[i] = count ? accum / count : 0;
          offsetBuffer = nextOffsetBuffer;
        }
        return result;
      }

      function stopTracks(stream) {
        stream?.getTracks().forEach((track) => {
          try {
            track.stop();
          } catch (_) {}
        });
      }

      async function startAudio() {
        if (audioStream) return;
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
      }

      async function startVideo() {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
        };
        const next = await navigator.mediaDevices.getUserMedia(constraints);
        stopTracks(videoStream);
        videoStream = next;
        previewEl.srcObject = videoStream;
        updateCameraUI();
        await previewEl.play().catch(() => {});
      }

      function stopVideo() {
        stopFrameLoop();
        stopTracks(videoStream);
        videoStream = null;
        previewEl.srcObject = null;
        updateCameraUI();
      }

      function ensureCaptureCanvas() {
        if (!captureCanvas) {
          captureCanvas = document.createElement("canvas");
          captureCtx = captureCanvas.getContext("2d", { alpha: false });
        }
      }

      function startFrameLoop() {
        stopFrameLoop();
        if (!cameraOn) return;
        sendVideoFrame();
        frameTimer = window.setInterval(sendVideoFrame, FRAME_MS);
      }

      function stopFrameLoop() {
        if (frameTimer) {
          clearInterval(frameTimer);
          frameTimer = 0;
        }
      }

      async function sendVideoFrame() {
        if (sendingFrame || !cameraOn || !setupComplete) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (!previewEl.videoWidth) return;
        sendingFrame = true;
        try {
          ensureCaptureCanvas();
          let width = previewEl.videoWidth;
          let height = previewEl.videoHeight;
          const longest = Math.max(width, height);
          if (longest > FRAME_MAX) {
            const scale = FRAME_MAX / longest;
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          captureCanvas.width = width;
          captureCanvas.height = height;
          captureCtx.save();
          if (facingMode === "user") {
            captureCtx.translate(width, 0);
            captureCtx.scale(-1, 1);
          }
          captureCtx.drawImage(previewEl, 0, 0, width, height);
          captureCtx.restore();
          const blob = await new Promise((resolve) => captureCanvas.toBlob(resolve, "image/jpeg", JPEG_QUALITY));
          if (!blob) return;
          const buffer = await blob.arrayBuffer();
          ws.send(
            JSON.stringify({
              realtimeInput: {
                video: {
                  data: arrayBufferToBase64(buffer),
                  mimeType: "image/jpeg",
                },
              },
            }),
          );
        } catch (error) {
          console.error("[VIDEO] frame send failed:", error);
        } finally {
          sendingFrame = false;
        }
      }

      function startMicrophoneGraph() {
        if (talking || !audioStream) return;
        inputContext = new AudioContext();
        sourceNode = inputContext.createMediaStreamSource(audioStream);
        processorNode = inputContext.createScriptProcessor(4096, 1, 1);
        processorNode.onaudioprocess = (event) => {
          if (!talking || !ws || ws.readyState !== WebSocket.OPEN) return;
          const input = event.inputBuffer.getChannelData(0);
          const downsampled = downsampleTo16k(input, inputContext.sampleRate);
          const pcm16 = floatTo16BitPCM(downsampled);
          try {
            ws.send(
              JSON.stringify({
                realtimeInput: {
                  audio: {
                    data: arrayBufferToBase64(pcm16),
                    mimeType: "audio/pcm;rate=16000",
                  },
                },
              }),
            );
          } catch (error) {
            console.error("[AUDIO] send failed:", error);
          }
        };
        sourceNode.connect(processorNode);
        silentGain = inputContext.createGain();
        silentGain.gain.value = 0;
        processorNode.connect(silentGain);
        silentGain.connect(inputContext.destination);
        talking = true;
      }

      function stopMicrophoneGraph(sendEnd) {
        const wasTalking = talking;
        talking = false;
        if (sendEnd && wasTalking && ws && ws.readyState === WebSocket.OPEN) {
          try {
            ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
          } catch (_) {}
        }
        if (processorNode) {
          processorNode.onaudioprocess = null;
          try {
            processorNode.disconnect();
          } catch (_) {}
          processorNode = null;
        }
        try {
          silentGain?.disconnect();
        } catch (_) {}
        try {
          sourceNode?.disconnect();
        } catch (_) {}
        silentGain = null;
        sourceNode = null;
        if (inputContext) {
          inputContext.close().catch(() => {});
          inputContext = null;
        }
      }

      function ensureOutputAnalyser() {
        if (!outputContext) outputContext = new AudioContext();
        if (!outputAnalyser) {
          outputAnalyser = outputContext.createAnalyser();
          outputAnalyser.fftSize = 512;
          outputAnalyser.smoothingTimeConstant = 0.22;
          outputAnalyserBytes = new Uint8Array(outputAnalyser.fftSize);
          outputAnalyser.connect(outputContext.destination);
        }
        return outputAnalyser;
      }

      function startOrbVisual() {
        if (orbRaf) return;
        const tick = () => {
          let level = 0;
          if (outputAnalyser && outputAnalyserBytes) {
            outputAnalyser.getByteTimeDomainData(outputAnalyserBytes);
            let sum = 0;
            for (let i = 0; i < outputAnalyserBytes.length; i++) {
              const v = (outputAnalyserBytes[i] - 128) / 128;
              sum += v * v;
            }
            level = Math.min(1, Math.sqrt(sum / outputAnalyserBytes.length) * 4);
          }
          document.documentElement.style.setProperty("--level", String(level));
          orbRaf = requestAnimationFrame(tick);
        };
        orbRaf = requestAnimationFrame(tick);
      }

      function stopOrbVisual() {
        if (orbRaf) cancelAnimationFrame(orbRaf);
        orbRaf = 0;
        document.documentElement.style.setProperty("--level", "0");
      }

      async function playPCM(base64) {
        if (!connected || !base64) return;
        if (!outputContext) outputContext = new AudioContext();
        if (outputContext.state === "suspended") {
          try {
            await outputContext.resume();
          } catch (_) {
            return;
          }
        }
        const int16 = new Int16Array(base64ToArrayBuffer(base64));
        if (!int16.length) return;
        const audioBuffer = outputContext.createBuffer(1, int16.length, 24000);
        const channel = audioBuffer.getChannelData(0);
        for (let i = 0; i < int16.length; i++) channel[i] = int16[i] / 32768;
        const source = outputContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(ensureOutputAnalyser());
        activeAudioSources.add(source);
        source.onended = () => activeAudioSources.delete(source);
        const now = outputContext.currentTime;
        if (nextPlayTime < now) nextPlayTime = now;
        try {
          source.start(nextPlayTime);
          nextPlayTime += audioBuffer.duration;
          startOrbVisual();
          aiStateEl.textContent = "正在说话";
          if (speakingTimer) clearTimeout(speakingTimer);
          speakingTimer = setTimeout(() => {
            if (connected) aiStateEl.textContent = "正在听";
          }, Math.max(0, (nextPlayTime - outputContext.currentTime) * 1000) + 120);
        } catch (error) {
          activeAudioSources.delete(source);
          console.error("[AUDIO] play failed:", error);
        }
      }

      function stopAudioPlayback() {
        for (const source of activeAudioSources) {
          try {
            source.stop();
          } catch (_) {}
          try {
            source.disconnect();
          } catch (_) {}
        }
        activeAudioSources.clear();
        if (speakingTimer) {
          clearTimeout(speakingTimer);
          speakingTimer = null;
        }
        nextPlayTime = outputContext ? outputContext.currentTime : 0;
        aiStateEl.textContent = connected ? "正在听" : "Gemini";
      }

      async function handleGeminiMessage(event) {
        if (!connected || (ws && event.target !== ws)) return;
        const text = await websocketDataToText(event.data);
        if (!connected || !text) return;
        let message;
        try {
          message = JSON.parse(text);
        } catch (_) {
          return;
        }
        if (message.setupComplete) {
          setupComplete = true;
          badgeEl.textContent = "实时";
          setAppState("live");
          setCallButton(true);
          callBtn.disabled = false;
          setStatus("已接通，可以直接说话");
          aiStateEl.textContent = "正在听";
          try {
            if (!audioStream) await startAudio();
            if (cameraOn && !videoStream) await startVideo();
            await inputContext?.resume();
            await outputContext?.resume();
            startMicrophoneGraph();
            startFrameLoop();
          } catch (error) {
            console.error("[MEDIA] start failed:", error);
            setStatus("无法访问麦克风或摄像头，请检查权限");
          }
          return;
        }
        if (message.error) {
          console.error("[GEMINI] error:", message.error);
          setStatus("Gemini 返回错误，请查看控制台");
          return;
        }
        const serverContent = message.serverContent;
        if (!serverContent) return;
        if (serverContent.inputTranscription?.text) {
          userTranscript += serverContent.inputTranscription.text;
          setCaption(userCaptionEl, userTranscript);
        }
        if (serverContent.outputTranscription?.text) {
          aiTranscript += serverContent.outputTranscription.text;
          setCaption(aiCaptionEl, aiTranscript);
        }
        if (Array.isArray(serverContent.modelTurn?.parts)) {
          for (const part of serverContent.modelTurn.parts) {
            if (part.inlineData?.data) playPCM(part.inlineData.data);
          }
        }
        if (serverContent.interrupted) {
          stopAudioPlayback();
          userTranscript = "";
          aiTranscript = "";
        }
        if (serverContent.turnComplete) {
          userTranscript = "";
          aiTranscript = "";
        }
      }

      function connect() {
        if (connected || connecting) return;
        connecting = true;
        manualClosing = false;
        callBtn.disabled = true;
        badgeEl.textContent = "连接中";
        setAppState("connecting");
        setStatus("正在连接 Gemini 3.8 Live");
        try {
          ws = new WebSocket(LIVE_WS_URL);
        } catch (error) {
          connecting = false;
          callBtn.disabled = false;
          setAppState();
          badgeEl.textContent = "离线";
          setStatus("无法创建连接");
          return;
        }
        ws.onopen = () => {
          connected = true;
          connecting = false;
          const setup = {
            model: `models/${MODEL}`,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: "Zephyr" },
                },
              },
            },
            systemInstruction: {
              parts: [
                {
                  text:
                    "你是视频通话里的中文语音助手。你能看到用户摄像头画面。" +
                    "用自然、简短的中文口语回答。看到画面里的物体、文字或动作时可以主动提到。" +
                    "不要朗读 Markdown，不要列很长的条目。",
                },
              ],
            },
            inputAudioTranscription: {},
            outputAudioTranscription: {},
          };
          ws.send(JSON.stringify({ setup }));
          setStatus("连接已建立，正在初始化模型");
        };
        ws.onmessage = handleGeminiMessage;
        ws.onerror = () => setStatus("WebSocket 出错");
        ws.onclose = () => {
          finishCall(manualClosing ? "通话已结束" : "连接中断，请重新开始");
        };
      }

      async function startCall() {
        if (!outputContext) outputContext = new AudioContext();
        await outputContext.resume().catch(() => {});
        await requestWakeLock();
        try {
          await startAudio();
          if (cameraOn) await startVideo();
        } catch (error) {
          console.error("[MEDIA] permission:", error);
          setStatus("请允许麦克风和摄像头权限");
          await releaseWakeLock();
          return;
        }
        updateCameraUI();
        connect();
      }

      function finishCall(statusText) {
        connected = false;
        connecting = false;
        setupComplete = false;
        talking = false;
        stopMicrophoneGraph(false);
        stopFrameLoop();
        stopAudioPlayback();
        stopOrbVisual();
        stopTracks(audioStream);
        audioStream = null;
        stopVideo();
        releaseWakeLock();
        userTranscript = "";
        aiTranscript = "";
        setCaption(aiCaptionEl, "");
        setCaption(userCaptionEl, "");
        callBtn.disabled = false;
        setCallButton(false);
        setAppState();
        badgeEl.textContent = "离线";
        aiStateEl.textContent = "Gemini";
        setStatus(statusText);
      }

      function endCall() {
        manualClosing = true;
        const socket = ws;
        ws = null;
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
          try {
            socket.close(1000, "Call ended");
          } catch (_) {}
        }
        // 不要等 onclose：代理卡住时界面会一直停在「正在结束通话 / 正在听」
        finishCall("通话已结束");
      }

      callBtn.addEventListener("click", async () => {
        if (connected || connecting) {
          callBtn.disabled = true;
          setStatus("正在结束通话");
          endCall();
          return;
        }
        await startCall();
      });

      camBtn.addEventListener("click", async () => {
        cameraOn = !cameraOn;
        if (!cameraOn) {
          stopVideo();
          setStatus(connected ? "摄像头已关闭，继续语音对话" : "摄像头已关闭");
          return;
        }
        try {
          await startVideo();
          if (setupComplete) startFrameLoop();
          setStatus(connected ? "摄像头已开启" : "摄像头已就绪");
        } catch (error) {
          cameraOn = false;
          updateCameraUI();
          setStatus("无法开启摄像头");
        }
      });

      flipBtn.addEventListener("click", async () => {
        if (flipping) return;
        facingMode = facingMode === "user" ? "environment" : "user";
        previewEl.classList.toggle("rear", facingMode === "environment");
        if (!cameraOn) {
          setStatus(facingMode === "user" ? "已切到前置摄像头" : "已切到后置摄像头");
          return;
        }
        flipping = true;
        try {
          await startVideo();
          setStatus(facingMode === "user" ? "前置摄像头" : "后置摄像头");
        } catch (error) {
          facingMode = facingMode === "user" ? "environment" : "user";
          previewEl.classList.toggle("rear", facingMode === "environment");
          setStatus("这台设备没有可切换的另一个摄像头");
        } finally {
          flipping = false;
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && connected) requestWakeLock();
      });

      window.addEventListener("beforeunload", () => {
        if (connected || connecting) endCall();
      });

      updateCameraUI();
    </script>
  </body>
</html>
